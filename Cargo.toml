[package]
name = "hive"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Tiny LAN agent mesh: run CLI agents on several Macs over home WiFi from one terminal"
license = "MIT"

[dependencies]
serde_json = "1"
socket2 = { version = "0.5", features = ["all"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
