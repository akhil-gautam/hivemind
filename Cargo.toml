[package]
name = "hivemind"
version = "0.2.0"
edition = "2021"
rust-version = "1.75"
description = "Run CLI agents on several Macs over the home WiFi and drive them from one browser page"
license = "MIT"

[dependencies]
serde_json = "1"
socket2 = { version = "0.5", features = ["all"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
